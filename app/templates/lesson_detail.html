<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ lesson.title }}</title>
</head>
<body>
    <header>
        <h1>Lesson Name : {{ lesson.title }}</h1>
    </header>
    <main>
        <p><b>Lesson Number :</b> {{ lesson.position }}</p>
        <p><b>Content : </b>{{ lesson.content }}</p>

        <a href="{{ url_for("Instructor.course_detail" , course_id = course.id)}}">
            <button type="submit"> Back To Course </button>
        </a>
            <br>
            <br>
        <a href="{{ url_for("Instructor.lesson_edit" , course_id = course.id , lesson_id = lesson.id)}}">
            <button type="submit">Edit Lesson </button>
        </a>
        <br>
        <br>
        <form method="POST" 
        action="{{ url_for(
            "Instructor.delete_lesson" ,
            course_id=course.id ,
            lesson_id = lesson.id
            )}}">

            {{ form.hidden_tag() }}
            <button type="submit"
                 onclick="return confirm('Are you sure you want to delete this lesson?')"> 
                Delete Lesson
            </button>
        </form>
    </main>
</body>
</html>
